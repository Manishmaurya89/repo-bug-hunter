<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Run Replays</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1f; --muted: #66666d; --border: #e2e2de;
    --accent: #2f5fd0; --ok: #1d7348; --ok-bg: #e4f3ea; --bad: #b3261e; --bad-bg: #fbe9e8;
    --warn: #875800; --warn-bg: #fcf1dc; --code: #f3f3f0; --add: #e3f3e8; --del: #fbe7e6; --hunk: #ebeffa;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131315; --panel: #1b1b1e; --text: #e7e7ea; --muted: #9b9ba3; --border: #2d2d33;
      --accent: #8fb2ff; --ok: #71d49f; --ok-bg: #15301f; --bad: #ff8f86; --bad-bg: #3b1b1a;
      --warn: #f2c366; --warn-bg: #392d12; --code: #222226; --add: #163121; --del: #3a1c1c; --hunk: #1d2539;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0; overflow-wrap: anywhere; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  button, select, input { font: inherit; color: inherit; background: var(--panel);
         border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 8px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .compare { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; }
  .bars { display: grid; grid-template-columns: minmax(0, 260px) 1fr auto; gap: 4px 10px; align-items: center;
          margin-top: 10px; font-size: 12px; max-width: 720px; }
  .bar { height: 8px; background: var(--accent); border-radius: 4px; opacity: .7; }
  main { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: calc(100vh - 160px); }
  aside { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column;
          max-height: calc(100vh - 20px); position: sticky; top: 0; }
  .filters { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .filters input { flex: 1; min-width: 120px; }
  .list { overflow-y: auto; }
  .item { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 7px 10px;
          border-bottom: 1px solid var(--border); cursor: pointer; }
  .item:hover, .item.active { background: var(--code); }
  .item .id { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .item .meta { font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.ok { background: var(--ok); }
  section#replay { padding: 16px; min-width: 0; }
  .badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; margin-right: 6px; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  details.issue { margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  details.issue summary { padding: 8px 12px; cursor: pointer; }
  details.issue pre { margin: 0; padding: 0 12px 12px; white-space: pre-wrap; }
  .controls { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
              padding: 8px 0; background: var(--bg); }
  .controls input[type=range] { flex: 1; min-width: 120px; padding: 0; }
  .step { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); margin: 10px 0; padding: 10px 12px; }
  .step.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .step.hidden { display: none; }
  .step-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
  .thinking { color: var(--muted); font-style: italic; white-space: pre-wrap; margin: 6px 0; }
  .text { white-space: pre-wrap; margin: 6px 0; }
  .action { margin-top: 8px; }
  .tool { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  pre { font-family: var(--mono); font-size: 12px; background: var(--code); border-radius: 6px; padding: 8px 10px;
        overflow-x: auto; margin: 4px 0; white-space: pre; }
  pre.out { max-height: 420px; overflow-y: auto; }
  pre.err { box-shadow: inset 3px 0 0 var(--bad); }
  .more { font-size: 12px; padding: 1px 8px; }
  .diff span { display: block; }
  .diff .add { background: var(--add); }
  .diff .del { background: var(--del); }
  .diff .hunk { background: var(--hunk); color: var(--muted); }
  .diff .file { font-weight: 600; }
  .result { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: 12px; margin: 16px 0; }
  ul.tests { margin: 4px 0; padding-left: 18px; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .empty { padding: 40px 0; color: var(--muted); }
  @media (max-width: 800px) {
    main { grid-template-columns: minmax(0, 1fr); }
    aside { position: static; max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>Agent run replays</h1>
  <div class="muted">A coding agent fixing real bugs from SWE-bench Verified. Each run can be replayed step by step.</div>
  <div class="tabs" id="tabs"></div>
  <div id="summary"></div>
</header>
<main>
  <aside>
    <div class="filters">
      <input id="q" type="search" placeholder="Filter by id or repo" aria-label="Filter tasks">
      <select id="filter" aria-label="Show"></select>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <section id="replay"><div class="empty">Pick a task on the left to replay it.</div></section>
</main>
<script>
"use strict";
// Everything from trajectories goes in via text nodes: tool output is untrusted repository content.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  }
  return el;
}
const $ = (id) => document.getElementById(id);
const pct = (x) => `${Math.round(100 * x)}%`;
const money = (x) => (x === null || x === undefined) ? "n/a" : `$${x.toFixed(2)}`;
const STATUS = { submitted: "Submitted", step_limit: "Hit the step limit", cost_limit: "Hit the cost limit",
  refusal: "Refused", api_error: "API error", env_error: "Environment error" };

let M = null;                         // manifest
const S = { run: null, id: null, traj: null, step: 0, timer: null };

function params() { return new URLSearchParams(location.hash.slice(1)); }
function setHash() {
  const p = new URLSearchParams();
  if (S.run) p.set("run", S.run.name);
  if (S.id) p.set("id", S.id);
  if (S.traj) p.set("step", S.step);
  history.replaceState(null, "", "#" + p.toString());
}

async function start() {
  try { M = await (await fetch("data/manifest.json")).json(); }
  catch (e) { $("replay").replaceChildren(h("div", { class: "empty" }, "Could not load data/manifest.json. Serve this folder over HTTP, e.g. python -m http.server.")); return; }
  const p = params();
  const run = M.runs.find((r) => r.name === p.get("run")) || M.runs[0];
  selectRun(run, false);
  if (p.get("id")) await openTask(p.get("id"), Number(p.get("step")) || null);
}

function selectRun(run, keepTask = true) {
  S.run = run;
  $("tabs").replaceChildren(...M.runs.map((r) =>
    h("button", { "aria-pressed": r === run ? "true" : "false", onclick: () => { selectRun(r); } },
      r.name === r.config.variant ? r.name : `${r.name} · ${r.config.variant}`)));
  renderSummary();
  const f = $("filter");
  f.replaceChildren(h("option", { value: "all" }, "All tasks"), h("option", { value: "resolved" }, "Resolved"),
    h("option", { value: "unresolved" }, "Unresolved"),
    ...Object.keys(M.categories).filter((c) => run.summary.categories[c])
      .map((c) => h("option", { value: c }, `${c.replaceAll("_", " ")} (${run.summary.categories[c]})`)));
  renderList();
  if (keepTask && S.id && run.rows.some((r) => r.id === S.id)) openTask(S.id, S.step);
  else if (keepTask) { stop(); S.id = null; S.traj = null;
    $("replay").replaceChildren(h("div", { class: "empty" }, "Pick a task on the left to replay it.")); setHash(); }
}

function renderSummary() {
  const s = S.run.summary, c = S.run.config;
  const stat = (v, label) => h("div", { class: "stat" }, h("b", {}, v), h("span", {}, label));
  // Cost is known for Claude and OpenRouter; older runs only recorded base_url.
  const costKnown = c.provider ? ["anthropic", "openrouter"].includes(c.provider) : !c.base_url;
  const kids = [
    h("div", { class: "muted" }, `${c.model}${c.effort ? `, effort ${c.effort}` : ""}, up to ${c.max_steps} steps`,
      costKnown ? ` and ${money(c.max_cost)} per task` : " per task"),
    h("div", { class: "stats" },
      stat(`${s.resolved}/${s.n}`, `resolved (${pct(s.rate)}, 95% CI ${pct(s.ci[0])}–${pct(s.ci[1])})`),
      stat(money(s.cost_mean), "mean cost per issue"),
      stat(money(s.cost_per_resolved), "cost per resolved issue"),
      stat(s.steps_mean.toFixed(1), "mean steps per issue"),
      stat(`${Math.round(s.tokens_mean / 1000)}k`, "mean tokens per issue")),
  ];
  const cats = Object.entries(s.categories).filter(([, n]) => n);
  if (cats.length) {
    const max = Math.max(...cats.map(([, n]) => n));
    kids.push(h("div", { class: "bars", role: "list", "aria-label": "Why unresolved tasks failed" },
      cats.flatMap(([k, n]) => [h("span", {}, M.categories[k].split(":")[0]),
        h("div", { class: "bar", style: `width:${(100 * n) / max}%` }), h("span", {}, n)])));
  }
  const cmp = M.comparison;
  if (cmp) {
    const link = (id) => h("a", { href: "#", onclick: (e) => { e.preventDefault(); openTask(id); } }, id);
    const list = (ids) => ids.length ? ids.flatMap((id, i) => i ? [", ", link(id)] : [link(id)]) : ["none"];

    kids.push(h("div", { class: "compare" },
      h("div", {}, h("b", {}, `${cmp.a} ${pct(cmp.rate_a)} → ${cmp.b} ${pct(cmp.rate_b)}`),
        ` on ${cmp.n} shared task${cmp.n === 1 ? "" : "s"}: ${(100 * cmp.delta >= 0 ? "+" : "")}${(100 * cmp.delta).toFixed(1)} pts`,
        cmp.delta_ci ? ` (95% CI ${Math.round(100 * cmp.delta_ci[0])} to ${Math.round(100 * cmp.delta_ci[1])})` : "",
        `, McNemar p = ${cmp.p_value.toFixed(3)}`),
      cmp.p_value >= 0.05 ? h("div", {}, "At this sample size the difference could be noise.") : null,
      h("div", { class: "muted" }, `Only ${cmp.b} solved: `, ...list(cmp.only_b)),
      h("div", { class: "muted" }, `Only ${cmp.a} solved: `, ...list(cmp.only_a))));
  }
  $("summary").replaceChildren(...kids);
}

function renderList() {
  const q = $("q").value.toLowerCase(), f = $("filter").value || "all";
  const rows = S.run.rows.filter((r) =>
    (!q || r.id.toLowerCase().includes(q) || r.repo.toLowerCase().includes(q)) &&
    (f === "all" || (f === "resolved" ? r.resolved : f === "unresolved" ? !r.resolved : r.category === f)));
  $("list").replaceChildren(...rows.map((r) => h("div", {
      class: "item" + (r.id === S.id ? " active" : ""), role: "button", tabindex: "0",
      onclick: () => openTask(r.id), onkeydown: (e) => { if (e.key === "Enter") openTask(r.id); } },
    h("span", { class: "dot" + (r.resolved ? " ok" : ""), title: r.resolved ? "resolved" : "unresolved" }),
    h("span", { class: "id" }, r.id),
    h("span", { class: "meta" }, `${money(r.cost)} · ${r.steps} steps`,
      r.category ? h("div", {}, r.category.replaceAll("_", " ")) : null))),
    rows.length ? [] : [h("div", { class: "empty", style: "padding:20px" }, "No tasks match.")]);
}

async function openTask(id, step = null) {
  stop();
  if (!S.run.rows.some((r) => r.id === id)) return;
  S.id = id;
  renderList();
  $("replay").replaceChildren(h("div", { class: "empty" }, "Loading…"));
  S.traj = await (await fetch(`data/${encodeURIComponent(S.run.name)}/${encodeURIComponent(id)}.json`)).json();
  renderReplay();
  go(step === null ? 1 : step);
  const top = $("replay").getBoundingClientRect().top;
  if (top < 0 || top > window.innerHeight * 0.6) $("replay").scrollIntoView({ block: "start" });
}

function renderReplay() {
  const t = S.traj, ev = t.eval || {}, n = t.steps.length;
  let cum = 0;
  const steps = t.steps.map((s) => { cum += s.cost; return renderStep(s, cum); });
  const verdict = ev.resolved ? h("span", { class: "badge ok" }, "Resolved")
    : h("span", { class: "badge bad" }, "Unresolved");
  const cat = t.category ? h("span", { class: "badge warn" }, M.categories[t.category].split(":")[0]) : null;
  const slider = h("input", { type: "range", min: n ? 1 : 0, max: n, value: 1, id: "slider",
    "aria-label": "Step", oninput: (e) => go(Number(e.target.value)) });
  $("replay").replaceChildren(
    h("h2", {}, t.instance_id),
    h("div", { class: "muted" }, `${t.task.repo} · ${t.task.difficulty || "difficulty unknown"} · ${t.variant} · `,
      `${n} steps · ${money(t.cost)} · ${STATUS[t.exit_status] || t.exit_status}`),
    h("div", { style: "margin-top:6px" }, verdict, cat),
    h("details", { class: "issue" }, h("summary", {}, "The issue"), h("pre", {}, t.problem_statement)),
    h("div", { class: "controls" },
      h("button", { onclick: () => go(1), "aria-label": "First step" }, "⏮"),
      h("button", { onclick: () => go(S.step - 1), "aria-label": "Previous step" }, "◀"),
      h("button", { id: "play", onclick: toggle }, "Play"),
      h("button", { onclick: () => go(S.step + 1), "aria-label": "Next step" }, "▶"),
      h("button", { onclick: () => go(n), "aria-label": "Last step and result" }, "⏭"),
      slider, h("span", { id: "pos", class: "muted" })),
    h("div", { id: "steps" }, steps),
    h("div", { id: "final", class: "result" }, renderResult(t)));
}

function renderStep(s, cum) {
  return h("div", { class: "step" },
    h("div", { class: "step-head" }, h("span", {}, `Step ${s.i}`),
      h("span", {}, `${s.model} · +${money(s.cost)} · ${money(cum)} so far`)),
    s.thinking.map((x) => h("div", { class: "thinking" }, x)),
    s.text.map((x) => h("div", { class: "text" }, x)),
    s.actions.length ? s.actions.map(renderAction)
      : h("div", { class: "muted" }, "No tool call, so nothing ran. The agent was reminded to use a tool."));
}

function renderAction(a) {
  const inp = a.input || {};
  let call;
  switch (a.tool) {
    case "bash": case "record_failing_test": call = h("pre", {}, "$ " + inp.command); break;
    case "read_file": call = h("pre", {}, inp.path + (inp.start_line ? `  (lines ${inp.start_line}–${inp.end_line || "end"})` : "")); break;
    case "search": call = h("pre", {}, `/${inp.pattern}/  in ${inp.path || "."}`); break;
    case "edit_file": call = diffBlock([`--- ${inp.path}`, ...String(inp.old_str).split("\n").map((l) => "-" + l),
      ...String(inp.new_str).split("\n").map((l) => "+" + l)].join("\n")); break;
    case "write_file": call = collapsible(`${inp.path}\n\n${inp.content}`, "", 12); break;
    case "submit": call = null; break;
    default: call = h("pre", {}, JSON.stringify(inp, null, 2));
  }
  return h("div", { class: "action" }, h("div", { class: "tool" }, a.tool), call,
    collapsible(a.output, "pre out" + (a.is_error ? " err" : ""), 30));
}

function collapsible(text, cls, maxLines) {
  const lines = String(text ?? "").split("\n");
  const pre = h("pre", { class: cls }, lines.length > maxLines ? lines.slice(0, maxLines).join("\n") : text);
  if (lines.length <= maxLines) return pre;
  const btn = h("button", { class: "more", onclick: () => { pre.textContent = text; btn.remove(); } },
    `Show all ${lines.length} lines`);
  return h("div", {}, pre, btn);
}

function diffBlock(text) {
  const cls = (l) => l.startsWith("+++") || l.startsWith("---") || l.startsWith("diff ") ? "file"
    : l.startsWith("@@") ? "hunk" : l.startsWith("+") ? "add" : l.startsWith("-") ? "del" : "";
  return h("pre", { class: "diff" }, String(text).replace(/\n$/, "").split("\n").map((l) => h("span", { class: cls(l) }, l || " ")));
}

function renderResult(t) {
  const ev = t.eval || {};
  const kids = [h("h3", { style: "margin-top:0" }, "Result")];
  kids.push(h("div", {}, `Agent: ${STATUS[t.exit_status] || t.exit_status}. `,
    ev.resolved ? "The project's tests pass: resolved." : "Not resolved.",
    t.category ? ` ${M.categories[t.category]}.` : ""));
  const REPRO = { reproduced: "bug reproduced", unreproduced: "could not reproduce the bug",
    none: "no reproduction recorded" };
  if (t.repro) kids.push(h("div", { class: "muted" }, `Test-first: ${REPRO[t.repro.status] || t.repro.status}`,
    t.repro.command ? ` by ${t.repro.command}` : "",
    t.repro.passed_at_submit === null || t.repro.passed_at_submit === undefined ? ""
      : t.repro.passed_at_submit ? ", passing at submit" : ", still failing at submit"));
  if (ev.error) kids.push(h("div", { class: "muted" }, `Grader: ${ev.error}`));
  const tests = (title, names) => names && names.length ? [h("h3", {}, title),
    h("ul", { class: "tests" }, names.slice(0, 50).map((x) => h("li", {}, x))),
    names.length > 50 ? h("div", { class: "muted" }, `and ${names.length - 50} more`) : null] : [];
  kids.push(...tests("Target tests still failing", ev.f2p_failed), ...tests("Previously passing tests now failing", ev.p2p_failed));
  if (ev.f2p_passed && ev.f2p_passed.length) kids.push(h("div", { class: "muted" },
    `${ev.f2p_passed.length} target test(s) now pass; ${ev.p2p_passed || 0} existing test(s) still pass.`));
  kids.push(h("h3", {}, "Final patch"));
  kids.push(t.patch ? diffBlock(t.patch) : h("div", { class: "muted" }, "Empty patch."));
  if (t.task.gold_files) kids.push(h("div", { class: "muted" }, `The real fix changed: ${t.task.gold_files.join(", ")}`));
  return kids;
}

function go(i) {
  const n = S.traj.steps.length;
  S.step = Math.max(n ? 1 : 0, Math.min(n, i));
  const cards = $("steps").children;
  for (let k = 0; k < cards.length; k++) {
    cards[k].classList.toggle("hidden", k >= S.step);
    cards[k].classList.toggle("current", k === S.step - 1);
  }
  $("final").hidden = S.step < n;
  $("slider").value = S.step;
  $("pos").textContent = `Step ${S.step} of ${n}`;
  if (S.step >= n) stop();
  const cur = cards[S.step - 1];
  if (cur && S.timer) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
  setHash();
}

function toggle() { if (S.timer) stop(); else { if (S.step >= S.traj.steps.length) go(1);
  S.timer = setInterval(() => go(S.step + 1), 1200); $("play").textContent = "Pause"; } }
function stop() { clearInterval(S.timer); S.timer = null; const b = $("play"); if (b) b.textContent = "Play"; }

document.addEventListener("keydown", (e) => {
  if (!S.traj || ["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key === "ArrowRight") go(S.step + 1);
  else if (e.key === "ArrowLeft") go(S.step - 1);
  else if (e.key === " ") { e.preventDefault(); toggle(); }
});
$("q").addEventListener("input", renderList);
$("filter").addEventListener("change", renderList);
start();
</script>
</body>
</html>
