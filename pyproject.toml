[project]
name = "repo-bug-hunter"
version = "0.4.0"
description = "An AI coding agent that fixes real GitHub bugs, and a lab that measures it: graded by hidden tests, every run replayable."
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Manish Maurya" }]
requires-python = ">=3.10"
keywords = ["ai-agents", "coding-agent", "llm", "swe-bench", "evaluation", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=1.0",
    "certifi",
    "datasets>=2.18",
    "openai>=3.22.0",
    "swebench>=4.0",
]

[project.urls]
Homepage = "https://github.com/Manishmaurya89/repo-bug-hunter"
Documentation = "https://github.com/Manishmaurya89/repo-bug-hunter/blob/main/IMPLEMENTATION.md"
Issues = "https://github.com/Manishmaurya89/repo-bug-hunter/issues"
Changelog = "https://github.com/Manishmaurya89/repo-bug-hunter/blob/main/CHANGELOG.md"

[project.scripts]
repo-bug-hunter = "repo_bug_hunter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo_bug_hunter"]

# The example runs `repo-bug-hunter demo` replays; in a source checkout it reads them from runs/.
[tool.hatch.build.targets.wheel.force-include]
"runs/free_pilot" = "repo_bug_hunter/examples/free_pilot"
"runs/local_pilot" = "repo_bug_hunter/examples/local_pilot"
"runs/local_pilot_tf" = "repo_bug_hunter/examples/local_pilot_tf"
"runs/openrouter_pilot" = "repo_bug_hunter/examples/openrouter_pilot"

[tool.hatch.build.targets.sdist]
include = ["/repo_bug_hunter", "/tests", "/README.md", "/runs/free_pilot", "/runs/local_pilot",
           "/runs/local_pilot_tf", "/runs/openrouter_pilot"]

# PyPI shows the README without the Mermaid diagram, which only GitHub draws, and with
# repository links made absolute: relative ones would point into pypi.org.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)```mermaid\n.*?```\n\n'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/Manishmaurya89/repo-bug-hunter/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
