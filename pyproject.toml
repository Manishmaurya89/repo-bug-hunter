[project]
name = "repo-bug-hunter"
version = "0.2.0"
description = "Measure a coding agent on real GitHub bugs: free models, graded by SWE-bench, with replays and paired statistics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "datasets>=2.18",
    "openai>=3.22.0",
    "swebench>=4.0",
]

[project.scripts]
repo-bug-hunter = "repo_bug_hunter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repo_bug_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
